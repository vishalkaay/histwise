name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME}"
          out="histwise-${version}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${out}"
          bin="histwise"
          if [ "$GOOS" = "windows" ]; then bin="histwise.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${out}/${bin}" .
          cp README.md LICENSE "dist/${out}/"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -r "${out}.zip" "${out}"
          else
            tar -czf "${out}.tar.gz" "${out}"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
